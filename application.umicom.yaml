schema: umicom.application.v1

application:
  id: org.umicom.education
  name: Umicom Education Studio
  short_name: Education Studio
  version: 0.1.0
  executable: umicom-education-console
  aliases: [education]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console

entry:
  kind: workbench
  taskbar_group: education
  pinned_by_default: false
  default_layout: course

capabilities:
  - umicom.education
  - umicom.ai.authorengine
  - umicom.media
  - umicom.ai
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true
